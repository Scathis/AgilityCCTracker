{% extends "base.html" %}
{% block title %}Login - Wildy Agility Mass{% endblock %}
{% block content %}
<article style="max-width: 24rem; margin: 3rem auto;">
  <h2>Log in</h2>
  {% if error %}<p style="color: var(--pico-del-color);">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="username">Username
      <input type="text" id="username" name="username" required autofocus>
    </label>
    <label for="password">Password
      <input type="password" id="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p><small>No account? <a href="/register">Request one</a> - an admin approves it before you can log in.</small></p>
</article>
{% endblock %}
