<details class="slot-card slot-{{ slot }}" id="slot-{{ slot }}">
  <summary>
    <div class="slot-summary-label">{{ label }}</div>
    {% if item %}
    <div class="slot-icons">
      <img src="{{ item.icon }}" alt="{{ item.name }}" title="{{ item.name }}" class="item-icon" loading="lazy" onerror="this.style.visibility='hidden'">
    </div>
    <div class="slot-placeholder"><small>{{ item.name }}</small></div>
    {% else %}
    <div class="slot-placeholder muted">Empty</div>
    {% endif %}
  </summary>
  <div class="slot-editor">
    {% if item %}
    <form method="post" action="/kits/{{ kit_id }}/slots/{{ slot }}/clear"
          hx-post="/kits/{{ kit_id }}/slots/{{ slot }}/clear"
          hx-target="#slot-{{ slot }}" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="secondary outline">Clear {{ label|lower }}</button>
    </form>
    {% endif %}
    <input type="search" name="q" placeholder="Search items..." autocomplete="off"
           class="slot-search-input"
           hx-get="/kits/{{ kit_id }}/slots/{{ slot }}/search"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#search-{{ slot }}">
    <div id="search-{{ slot }}"></div>
  </div>
</details>
