{% extends "base.html" %}
{% block title %}Account - Wildy Agility FC Tracker{% endblock %}
{% block content %}
<h2>Account</h2>
<p>Logged in as <strong>{{ user.username }}</strong> ({{ user.role.value }}).</p>
{% if saved %}<p><mark>Password changed.</mark></p>{% endif %}
<article style="max-width: 28rem;">
  <header><strong>Change password</strong></header>
  {% if error %}<p style="color: var(--pico-del-color);">{{ error }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password
      <input type="password" name="current" autocomplete="current-password" required>
    </label>
    <label>New password
      <input type="password" name="password" minlength="10" maxlength="128" autocomplete="new-password" required>
      <small>At least 10 characters.</small>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm" minlength="10" maxlength="128" autocomplete="new-password" required>
    </label>
    <button type="submit">Change password</button>
  </form>
</article>
{% endblock %}
