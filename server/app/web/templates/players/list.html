{% extends "base.html" %}
{% block title %}Players{% endblock %}
{% block content %}
<h2>Players</h2>
<form method="get" action="/players">
  <input type="search" name="q" value="{{ q }}" placeholder="Search RSN...">
  <button type="submit">Search</button>
</form>
<table>
  <thead><tr><th>RSN</th><th>Plugin user?</th><th>Last seen</th></tr></thead>
  <tbody>
    {% for p in players %}
    <tr><td><a href="/players/{{ p.id }}">{{ p.rsn }}</a></td><td>{{ "✅" if p.is_plugin_user else "—" }}</td><td>{{ p.last_seen }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
