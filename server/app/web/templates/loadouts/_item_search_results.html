{% if not query %}
<p><small>Type to search…</small></p>
{% elif not results %}
<p><small>No matches.</small></p>
{% else %}
<ul class="item-search-results">
  {% for item in results %}
  <li>
    <form method="post" action="/loadouts/{{ loadout_id }}/slots/{{ slot }}/items"
          hx-post="/loadouts/{{ loadout_id }}/slots/{{ slot }}/items"
          hx-target="#slot-{{ slot }}" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="item_id" value="{{ item.id }}">
      <button type="submit" class="outline item-search-result">
        <img src="{{ item.icon }}" alt="" class="item-icon-sm" loading="lazy" onerror="this.style.visibility='hidden'">
        {{ item.name }}
      </button>
    </form>
  </li>
  {% endfor %}
</ul>
{% endif %}
