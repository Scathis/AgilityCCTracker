name: CI

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: ./gradlew build --no-daemon

  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agilitycc_test
          MYSQL_USER: agilitycc
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir .[dev]
      - run: ruff check .
      - run: pytest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: agilitycc_test
          DB_USER: agilitycc
          DB_PASSWORD: test
          APP_SECRET: test-secret
          APP_URL: http://localhost
          PUBLIC_READ: 'false'
          HISCORES_ENABLED: 'false'
          ITEMS_ENABLED: 'false'
